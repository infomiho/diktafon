<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diktafon onboarding</title>
<script type="module" src="./onboarding.js?v=2"></script>
<style>
  @font-face { font-family: "Chakra Petch"; src: url("../../crates/diktafon/assets/fonts/ChakraPetch-SemiBold.ttf"); font-weight: 600; }
  :root {
    --background: #101229;
    --surface: #171934;
    --surface-raised: #242849;
    --surface-sunken: #0B0D20;
    --on-surface: #F1F2FF;
    --on-surface-muted: #AAACD6;
    --faint: #7F84A2;
    --muted: var(--on-surface-muted);
    --outline: rgba(155, 157, 255, 0.13);
    --accent: #9843C0;
    --on-accent: #F1F2FF;
    --ring-idle: #8E90BE;
    --switch-track: #5A6086;
    --status-live: #CE5CFF;
    --status-ok: #34D399;
    --raised-hover: #2B2F51;
    --accent-hover: #A853D1;
    --signal-red: #FF3B4D;
    --focus-ring: var(--accent);
    --outline-hover: rgba(155, 157, 255, 0.35);
    --font-display: "Chakra Petch", sans-serif;
    --font-ui: system-ui, sans-serif;
    --font-mono: "Menlo", monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; display: flex; flex-direction: column; align-items: center;
    gap: 40px; padding: 48px 0; font-family: var(--font-ui);
    color: var(--on-surface); font-size: 15px; line-height: 1.5;
  }
  dk-onboarding { display: flex; flex-direction: column; align-items: center; gap: 40px; }
</style>
</head>
<body>

  <dk-onboarding></dk-onboarding>

</body>
</html>
