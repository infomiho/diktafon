[workspace]
resolver = "3"
members = ["crates/diktafon", "crates/diktafond", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
diktafon-protocol = { path = "crates/protocol" }

[profile.dev.package."*"]
opt-level = 2
