[package]
name = "diktafon"
version = "0.1.0"
edition = "2024"

[dependencies]
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
llama-cpp-2 = { version = "0.1.154", features = ["metal"] }
encoding_rs = "0.8"
cpal = "0.16"
global-hotkey = "0.8"
arboard = "3"
enigo = "0.6"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 2
