<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>diktafon OG card</title>
    <style>
      :root {
        --background: #101229;
        --surface: #171934;
        --hairline: #9b9dff22;
        --text-primary: #f1f2ff;
        --text-dim: #aaacd6;
        --signal-magenta: #ce5cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--background);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .intro {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding-top: 64px;
      }

      .mark {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.5));
      }

      .title {
        margin: 0;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .tagline {
        margin: 0;
        font-size: 24px;
        color: var(--text-dim);
        letter-spacing: -0.01em;
      }

      .shot-frame {
        position: relative;
        width: 720px;
        margin-top: 44px;
        border: 1px solid var(--hairline);
        border-radius: 16px;
        overflow: hidden;
      }

      .shot {
        width: 720px;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="intro">
      <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="62" height="62" rx="16" fill="#101229" />
        <rect x="1.5" y="1.5" width="61" height="61" rx="15.5" fill="none" stroke="#9b9dff" stroke-opacity=".13" />
        <path fill-rule="evenodd" fill="#f1f2ff" d="M 15.2 18.8 H 48.8 A 7.2 7.2 0 0 1 56 26 V 38 A 7.2 7.2 0 0 1 48.8 45.2 H 15.2 A 7.2 7.2 0 0 1 8 38 V 26 A 7.2 7.2 0 0 1 15.2 18.8 Z M 28.52 32 A 7.92 7.92 0 1 0 12.68 32 A 7.92 7.92 0 1 0 28.52 32 Z M 37.64 25.4 A 2.04 2.04 0 1 0 33.56 25.4 A 2.04 2.04 0 1 0 37.64 25.4 Z M 43.04 25.4 A 2.04 2.04 0 1 0 38.96 25.4 A 2.04 2.04 0 1 0 43.04 25.4 Z M 48.44 25.4 A 2.04 2.04 0 1 0 44.36 25.4 A 2.04 2.04 0 1 0 48.44 25.4 Z M 37.64 32 A 2.04 2.04 0 1 0 33.56 32 A 2.04 2.04 0 1 0 37.64 32 Z M 43.04 32 A 2.04 2.04 0 1 0 38.96 32 A 2.04 2.04 0 1 0 43.04 32 Z M 48.44 32 A 2.04 2.04 0 1 0 44.36 32 A 2.04 2.04 0 1 0 48.44 32 Z M 37.64 38.6 A 2.04 2.04 0 1 0 33.56 38.6 A 2.04 2.04 0 1 0 37.64 38.6 Z M 43.04 38.6 A 2.04 2.04 0 1 0 38.96 38.6 A 2.04 2.04 0 1 0 43.04 38.6 Z M 48.44 38.6 A 2.04 2.04 0 1 0 44.36 38.6 A 2.04 2.04 0 1 0 48.44 38.6 Z" />
        <circle cx="20.6" cy="32" r="2.64" fill="#9843c0" />
      </svg>
      <h1 class="title">diktafon</h1>
      <p class="tagline">Local-only dictation for macOS</p>
    </div>
    <div class="shot-frame">
      <img class="shot" src="../../assets/diktafon.webp" alt="diktafon's General settings">
    </div>
  </body>
</html>
