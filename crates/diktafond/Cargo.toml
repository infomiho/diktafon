[package]
name = "diktafond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
llama-cpp-2 = { version = "0.1.154", features = ["metal"] }
encoding_rs = "0.8"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset"] }
tokio = { version = "1", features = ["rt", "time"] }
sha2 = "0.11"
hex = "0.4"
anyhow.workspace = true
diktafon-protocol.workspace = true

[features]
# Experimental CoreML execution provider for the ASR model; see the asr_bench
# example and docs/benchmarks.md.
coreml = ["transcribe-rs/ort-coreml"]
