[package]
name = "diktafon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Pinned to a Zed rev from 2026-08-21; gpui is not on crates.io.
gpui = { git = "https://github.com/zed-industries/zed", rev = "ef50ad95b522d49402d30ed11c484d63d57a0757" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ef50ad95b522d49402d30ed11c484d63d57a0757", features = ["font-kit"] }
cpal = "0.16"
futures = "0.3"
rodio = "0.22"
rustfft = "6"
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSEvent",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSButton",
    "NSControl",
    "NSView",
    "NSCell",
] }
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
serde_json = "1"
transcribe-rs = { version = "0.3.11", default-features = false, features = ["vad-silero"] }
global-hotkey = "0.8"
arboard = "3"
enigo = "0.6"
anyhow.workspace = true
diktafon-protocol.workspace = true

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
