[package]
name = "diktafon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# No rev here so gpui-component's identical git reference unifies to one
# gpui; the concrete zed commit is pinned by Cargo.lock (update it with
# `cargo update -p gpui --precise <sha>`). gpui is not on crates.io.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "14359a0cd" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "14359a0cd" }
cpal = "0.16"
futures = "0.3"
rustfft = "6"
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSScreen",
    "NSEvent",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSButton",
    "NSControl",
    "NSView",
    "NSCell",
    "NSBezierPath",
    "NSColor",
    "NSAppearance",
    "NSWindow",
    "NSPanel",
    "NSSound",
    "NSGraphics",
    "block2",
] }
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
transcribe-rs = { version = "0.3.11", default-features = false, features = ["vad-silero"] }
global-hotkey = "0.8"
libc = "0.2"
arboard = "3"
enigo = "0.6"
anyhow.workspace = true
diktafon-protocol.workspace = true

[dev-dependencies]
env_logger = "0.11"
log = "0.4"
